name: 'platform'
version: '1.0.0'
dbt-cloud:
  project-id: 70403104004281
require-dbt-version: [">=1.9.0"]
profile: 'platform'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # platform_database: "{{ env_var('DBT_TARGET_DB', 'ECOMMERCE_DEV') }}"
  # raw_database: "{{ env_var('DBT_RAW_DB', 'RAW_DEV') }}"
  source_database: 'LAB_DB_SCALEFREE_WEBINAR_6ZL1MOGE_INSTR_DEV'
  source_schema: 'POSTGRES_HB_FINANCIAL_SERVICES'

models:
  platform:
    01_staging:
      +materialized: view
      +schema: staging
      +meta:
        tier: bronze
    02_raw_vault:
      +schema: raw_vault
      +meta:
        tier: silver
    03_intermediate:
      +materialized: view
      +schema: intermediate
      +meta:
        tier: silver
    04_marts:
      core:
        +materialized: table
        +schema: core
        +meta:
          tier: gold

seeds:
  platform:
    +schema: seeds
    +quote_columns: false
