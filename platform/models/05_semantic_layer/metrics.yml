version: 2
metrics:
- name: anomaly_rate
  type: ratio
  label: Anomaly Rate
  description: Share of assessments flagged as anomalies.
  numerator:
    name: anomaly_assessments
  denominator:
    name: assessment_count
- name: any_approval_rate
  type: ratio
  label: Any-Approval Rate
  description: Share of assessments with any 'Approve...' recommendation, including strict conditions.
    Always roughly 13 points above approval_rate.
  numerator:
    name: any_approval_assessments
  denominator:
    name: assessment_count
- name: approval_rate
  type: ratio
  label: Approval Rate
  description: 'Share of assessments recommended ''Approve'' or ''Approve with Conditions''. This is the
    source system''s definition (it matches risk_assess_performance_metrics.approval_percentage). ''Approve
    with Strict Conditions'' does NOT count. For the broader reading use any_approval_rate.

    '
  numerator:
    name: approved_assessments
  denominator:
    name: assessment_count
- name: charge_off_rate
  type: ratio
  label: Charge-Off Rate
  description: 'Charged-off loans divided by MATURED loans (Fully Paid + Charged Off). Current loans are
    excluded from the denominator because their outcome is not known yet; dividing by all loans understates
    the rate.

    '
  numerator:
    name: charged_off_loans
  denominator:
    name: matured_loans
- name: denial_rate
  type: ratio
  label: Denial Rate
  description: Share of assessments recommended Deny.
  numerator:
    name: denied_assessments
  denominator:
    name: assessment_count
- name: high_risk_exposure_share
  type: ratio
  label: High-Risk Exposure Share
  description: Share of total exposure sitting in relationships whose latest risk level is High or Very
    High.
  numerator:
    name: high_risk_exposure
  denominator:
    name: total_exposure
- name: high_risk_rate
  type: ratio
  label: High-Risk Rate
  description: Share of assessments with risk level High or Very High.
  numerator:
    name: high_risk_assessments
  denominator:
    name: assessment_count
- name: net_loss_rate
  type: ratio
  label: Net Loss Rate
  description: Net principal loss after recoveries divided by the funded amount of matured loans.
  numerator:
    name: total_net_principal_loss
  denominator:
    name: matured_funded_amount
